name: attendance-be
services:
  mysql:
    container_name: mysqldb
    image: mysql:8.4
    ports:
      - 3308:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./infra/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
  nginx:
    container_name: api-gateway
    image: nginx:1.30.6-alpine
    ports:
      - 8080:80
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service

  auth-service:
    container_name: auth-service
    build:
      context: .
      args:
        - APP=auth-service
    environment:
      PORT: 3001
      AUTH_DB_URL: ${AUTH_DB_URL}
    depends_on:
      - mysql

volumes:
  mysqldata: