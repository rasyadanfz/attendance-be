name: attendance-be
services:
  mysql:
    container_name: mysqldb
    image: mysql:8.4
    ports:
      - 3308:3306
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      ATTENDANCE_DB_PASSWORD: ${ATTENDANCE_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      EMPLOYEE_DB_PASSWORD: ${EMPLOYEE_DB_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./infra/mysql/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  nginx:
    container_name: api-gateway
    image: nginx:1.30.6-alpine
    ports:
      - 8080:80
    volumes:
      - ./infra/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service

  auth-service:
    container_name: auth-service
    build:
      context: .
      args:
        - APP=auth-service
    environment:
      PORT: 3001
      SERVICE_KEY: ${SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_TIME: ${JWT_EXPIRY_TIME}
      AUTH_DB_URL: ${AUTH_DB_URL}
    command: >
      sh -c "npx typeorm migration:run -d dist/apps/auth-service/apps/auth-service/src/data-source.js &&
             node dist/apps/auth-service/apps/auth-service/src/main.js"
    depends_on:
      mysql:
        condition: service_healthy

  attendance-service:
    container_name: attendance-service
    build:
      context: .
      args:
        - APP=attendance-service
    environment:
      PORT: 3002
      SERVICE_KEY: ${SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_TIME: ${JWT_EXPIRY_TIME}
      ATTENDANCE_DB_URL: ${ATTENDANCE_DB_URL}
    command: >
      sh -c "npx typeorm migration:run -d dist/apps/attendance-service/apps/attendance-service/src/data-source.js &&
             node dist/apps/attendance-service/apps/attendance-service/src/main.js"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  employee-service:
    container_name: employee-service
    build:
      context: .
      args:
        - APP=employee-service
    environment:
      PORT: 3003
      SERVICE_KEY: ${SERVICE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_TIME: ${JWT_EXPIRY_TIME}
      EMPLOYEE_DB_URL: ${EMPLOYEE_DB_URL}
      AUTH_SERVICE_URL: http://auth-service:3001/
    command: >
      sh -c "npx typeorm migration:run -d dist/apps/employee-service/apps/employee-service/src/data-source.js &&
             node dist/apps/employee-service/apps/employee-service/src/main.js"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysqldata:
  uploads_data:
