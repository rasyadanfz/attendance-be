server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
    
    location /api/auth {
        set $upstream http://auth-service:3001;
        proxy_pass $upstream;
    }

    location /api/attendance {
        client_max_body_size 5M;
        set $upstream http://attendance-service:3002;
        proxy_pass $upstream;
    }

    location /api/employees {
        set $upstream http://employee-service:3003;
        proxy_pass $upstream;
    }
}