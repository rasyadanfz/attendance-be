server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /attendance/ {
        set $upstream http://attendance-service:3001;
        proxy_pass $upstream;
    }
    
    location /auth/ {
        set $upstream http://auth-service:3001;
        proxy_pass $upstream;
    }

    location /employee/ {
        set $upstream http://employee-service:3001;
        proxy_pass $upstream;
    }
}